<!DOCTYPE html>

  <head>
    <script>
      // Applied before paint to avoid a flash of the wrong theme —
      // defaults to dark (the app's original design) if nothing is stored yet.
      (function () {
        var stored = localStorage.getItem('alphanxt-theme');
        if (stored !== 'light') {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
